name: Deploy and Launch App on Port 8010

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup, Deploy & Launch on Port 8010 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Navigate to your project folder
          cd ~/Pradeep/pradeep-personal-ai/multi-task-agent

          # 2. Sync cleanly with GitHub
          git fetch origin main
          git reset --hard origin/main

          # 3. Create virtual environment if missing
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi

          # 4. Activate venv & install dependencies
          source venv/bin/activate
          pip install -r requirements.txt

          # 5. Create Systemd service pointing to main:app
          sudo tee /etc/systemd/system/myagent.service > /dev/null <<'EOF'
          [Unit]
          Description=Pradeep Multi Agent Workspace
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/home/ubuntu/Pradeep/pradeep-personal-ai/multi-task-agent
          ExecStart=/home/ubuntu/Pradeep/pradeep-personal-ai/multi-task-agent/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8010
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF

          # 6. Reload systemd & restart the app
          sudo systemctl daemon-reload
          sudo systemctl enable myagent
          sudo systemctl restart myagent
          echo "Deployment successful!"